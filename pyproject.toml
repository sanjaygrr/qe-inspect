[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-inspect"
version = "0.1.0"
description = "Diagnostic reports for Quantum ESPRESSO output files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjay Ramchandani" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["quantum-espresso", "dft", "materials-science", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest>=7"]
ase = ["ase>=3.22"]

[project.scripts]
qe-inspect = "qe_inspect.cli:main"

[project.urls]
Repository = "https://github.com/sanjaygrr/qe-inspect"

[tool.hatch.build.targets.sdist]
exclude = ["tests/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
